[project]
name = "hypermesh-conductor"
version = "0.1.0"
description = "Rules-based model-tier routing and task measurement for Conductor"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
conductor = "conductor.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
